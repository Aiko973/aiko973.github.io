# Configuration nginx pour le portfolio (site statique).
# Sert le dossier tel quel : aucune base de données, aucun runtime.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;

    # Pages : jamais de cache, pour que les modifs soient visibles tout de suite
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Contenu du site : cache court, il change quand Dorian édite content.js
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Images et polices : cache long
    location ~* \.(?:png|jpe?g|gif|webp|svg|mp4|webm|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Durcissement de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
